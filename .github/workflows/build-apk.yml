name: Build MaxBird Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose build target"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "debug"
          - "release"
          - "bundle"

jobs:
  build:
    name: Build APK & Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore & Signing Environment
        id: setup_signing
        run: |
          STORE_PWD="${{ secrets.STORE_PASSWORD }}"
          KEY_PWD="${{ secrets.KEY_PASSWORD }}"
          
          # Default passwords if not set in secrets
          if [ -z "$STORE_PWD" ]; then
            STORE_PWD="android"
          fi
          if [ -z "$KEY_PWD" ]; then
            KEY_PWD="android"
          fi
          
          # Check if custom base64 keystore exists in GitHub Secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64 secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          elif [ -f "$GITHUB_WORKSPACE/keystore_base64.txt" ] && [ ! -s "$GITHUB_WORKSPACE/my-upload-key.jks" ]; then
            echo "Decoding from keystore_base64.txt..."
            base64 --decode "$GITHUB_WORKSPACE/keystore_base64.txt" > "$GITHUB_WORKSPACE/my-upload-key.jks"
          elif [ ! -f "$GITHUB_WORKSPACE/my-upload-key.jks" ]; then
            echo "Generating fallback signing keystore..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PWD" \
              -keypass "$KEY_PWD" \
              -dname "CN=MaxBird, OU=Mobile, O=MaxBird, L=Dhaka, ST=Dhaka, C=BD"
          fi
          
          # Prepare debug.keystore if missing
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            if [ -f "$GITHUB_WORKSPACE/debug.keystore.base64" ]; then
              base64 --decode "$GITHUB_WORKSPACE/debug.keystore.base64" > "$GITHUB_WORKSPACE/debug.keystore"
            else
              keytool -genkeypair -v \
                -keystore "$GITHUB_WORKSPACE/debug.keystore" \
                -alias "androiddebugkey" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "android" \
                -keypass "android" \
                -dname "CN=Android Debug, O=Android, C=US"
            fi
          fi
          
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == '' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release Bundle (AAB for Play Store)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'bundle' || github.event.inputs.build_type == '' }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Organize Artifacts
        run: |
          mkdir -p artifacts
          
          # Copy Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/MaxBird-Debug.apk
          fi
          
          # Copy Release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/MaxBird-Release.apk
          fi
          
          # Copy Release Bundle (AAB)
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab artifacts/MaxBird-Release.aab
          fi

      - name: Upload Debug APK
        if: ${{ hashFiles('artifacts/MaxBird-Debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MaxBird-Debug-APK
          path: artifacts/MaxBird-Debug.apk
          retention-days: 14

      - name: Upload Release APK
        if: ${{ hashFiles('artifacts/MaxBird-Release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MaxBird-Release-APK
          path: artifacts/MaxBird-Release.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB)
        if: ${{ hashFiles('artifacts/MaxBird-Release.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MaxBird-Release-AAB
          path: artifacts/MaxBird-Release.aab
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 🚀 MaxBird Android Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/MaxBird-Debug.apk ]; then
            echo "| Debug APK | \`MaxBird-Debug.apk\` | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f artifacts/MaxBird-Release.apk ]; then
            echo "| Release APK | \`MaxBird-Release.apk\` | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f artifacts/MaxBird-Release.aab ]; then
            echo "| Release Bundle | \`MaxBird-Release.aab\` | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package Name:** \`com.maxbird.ff.app\`" >> $GITHUB_STEP_SUMMARY
          echo "**Min SDK:** \`26 (Android 8.0+)\`" >> $GITHUB_STEP_SUMMARY
